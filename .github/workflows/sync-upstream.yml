name: 🔄 同步上游仓库

on:
  schedule:
    # 每天 UTC 0:00 和 12:00 自动检查
    - cron: '0 0,12 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: ⚙️ 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔗 添加上游仓库
        run: |
          git remote add upstream https://github.com/luozikuan/kongshan-suying.git

      - name: 🔄 拉取上游更新
        run: |
          git fetch upstream main

      - name: 🔀 合并上游
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "✅ 已是最新，无需合并"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 发现上游更新，正在合并..."
            git merge upstream/main -m "🔄 自动同步上游 main 分支" || {
              echo "⚠️ 合并冲突，需要手动处理"
              echo "conflict=true" >> $GITHUB_OUTPUT
              exit 1
            }
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 推送更新
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin main

      - name: ⚠️ 冲突通知
        if: failure() && steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 上游同步冲突 - 需要手动处理',
              body: '上游 [luozikuan/kongshan-suying](https://github.com/luozikuan/kongshan-suying) 有更新，但合并时出现冲突。\n\n请手动执行：\n```bash\ngit checkout main\ngit fetch upstream main\ngit merge upstream/main\n# 解决冲突后\ngit push origin main\n```',
              labels: ['sync-conflict']
            })
